version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chat-allmasajid-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - allmasajid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: chat-allmasajid
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
    ports:
      - "3000:3000"
    networks:
      - allmasajid
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat-allmasajid.rule=Host(`chat.allmasajid.com`)"
      - "traefik.http.routers.chat-allmasajid.entrypoints=websecure"
      - "traefik.http.routers.chat-allmasajid.tls.certresolver=letsencrypt"
      - "traefik.http.services.chat-allmasajid.loadbalancer.server.port=3000"

volumes:
  postgres_data:
    driver: local

networks:
  allmasajid:
    external: true
